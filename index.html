<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竞赛攻略工作台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&family=Noto+Serif+SC:wght@700;900&family=Long+Cang&display=swap">
<style>
:root {
  /* 版式：顶部一行标题加导航，下面单列主区，最宽 1180px；写攻略页左窄栏管设置、右边编辑，窄屏叠成一栏 */
  --bg: #F2F4F8;
  --panel: #FFFFFF;
  --ink: #16223B;
  --muted: #56627C;
  --line: #D7DDE9;
  --accent: #1D4FB3;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6EDFB;
  --mark: #FFE066;
  --good: #1B7A4B;
  --good-soft: #E3F3EA;
  --warn: #8F5400;
  --warn-soft: #FBEFD9;
  --bad: #B8322A;
  --bad-soft: #FBE6E3;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1524; --panel: #151F35; --ink: #E7ECF7; --muted: #9AA7C2; --line: #2B3857;
    --accent: #8DB2FF; --accent-ink: #0B1630; --accent-soft: #1D2C4D; --mark: #6A5600;
    --good: #6DD49C; --good-soft: #143524; --warn: #F0B865; --warn-soft: #3A2C10; --bad: #FF8E84; --bad-soft: #40201D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1524; --panel: #151F35; --ink: #E7ECF7; --muted: #9AA7C2; --line: #2B3857;
  --accent: #8DB2FF; --accent-ink: #0B1630; --accent-soft: #1D2C4D; --mark: #6A5600;
  --good: #6DD49C; --good-soft: #143524; --warn: #F0B865; --warn-soft: #3A2C10; --bad: #FF8E84; --bad-soft: #40201D;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--font-body); }
h1, h2, h3, p { margin: 0; }
h2 { font: 700 20px/1.35 var(--font-display); text-wrap: balance; }
h3 { font-size: 16px; font-weight: 700; line-height: 1.4; text-wrap: balance; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { background: var(--panel); border-bottom: 1px solid var(--line); padding: 14px 20px; }
.top-in { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: flex-end; justify-content: space-between; }
.brand h1 { font: 900 26px/1.25 var(--font-display); }
.brand h1 span { background: linear-gradient(transparent 58%, var(--mark) 58%); padding: 0 2px; }
.brand p { font-size: 13px; color: var(--muted); margin-top: 2px; }
.cloud.ok { color: var(--good); }
.cloud.warn { color: var(--warn); }
.nav { display: flex; flex-wrap: wrap; gap: 4px; }
.nav a { padding: 7px 14px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 600; }
.nav a:hover { background: var(--accent-soft); }
.nav a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }

.page { max-width: 1180px; margin: 0 auto; padding: 22px 20px 96px; }
.stack { display: grid; gap: 18px; align-content: start; }
.stack.sm { gap: 10px; }
.stack > * { min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.muted { color: var(--muted); }
.sm { font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.offscreen { position: fixed; left: -9999px; top: 0; opacity: 0; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; }
.panel-h { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: flex-start; }
.panel-h p { max-width: 70ch; }

.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 14px; border-radius: 8px; font: inherit; font-weight: 600; line-height: 1.35; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { padding: 5px 11px; font-size: 13px; }
.btn.xs { padding: 2px 8px; font-size: 12.5px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill.cat { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.pill.in { background: var(--good-soft); border-color: transparent; color: var(--good); }
.pill.out { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.pill.mine { color: var(--ink); }
.pill.st-ok { color: var(--good); border-color: var(--good); }
.pill.st-one { color: var(--warn); border-color: var(--warn); }
.pill.st-guess { color: var(--warn); border-color: var(--warn); border-style: dashed; }
.pill.st-none { border-style: dashed; }
.pill.lv-must { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.pill.lv-should { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.pill.lv-ok { background: var(--good-soft); border-color: transparent; color: var(--good); }
.pill.zero { background: transparent; border-color: var(--line); color: var(--muted); }
.pill.st-1 { color: var(--warn); border-color: var(--warn); }
.pill.st-2 { color: var(--good); border-color: var(--good); }
.pill.st-3 { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.mark { background: linear-gradient(transparent 52%, var(--mark) 52%); font-weight: 700; padding: 0 2px; }
.mark.hot { background: var(--mark); border-radius: 3px; padding: 0 5px; }

.nodes { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.node { width: 100%; height: 100%; display: grid; gap: 4px; align-content: start; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--ink); font: inherit; cursor: pointer; }
.node:hover { border-color: var(--accent); }
.node-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.node strong { font-size: 16px; }
.node-text { font-size: 14px; }

.note { border: 1px dashed var(--line); border-radius: var(--r); padding: 10px 14px; }
.note summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.note > p, .note > div, .note > textarea, .note > button { margin-top: 10px; }
.note p { max-width: 72ch; }
.banner { background: var(--warn-soft); border-left: 4px solid var(--warn); border-radius: 8px; padding: 10px 14px; max-width: 84ch; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar .input { flex: 1 1 200px; max-width: 320px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel); }
.seg-b { border: 0; background: transparent; color: var(--muted); padding: 7px 13px; font: inherit; font-weight: 600; cursor: pointer; }
.seg-b.on { background: var(--accent); color: var(--accent-ink); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.comp { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.comp h3 { font-size: 17px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 14px; }
.kv dt { color: var(--muted); white-space: nowrap; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.kv.wide { font-size: 15px; gap: 6px 16px; }
.comp-f { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }

.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
label, .label { font-weight: 600; font-size: 14px; }
.label-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); color: var(--ink); font: inherit; }
textarea.input { resize: vertical; line-height: 1.7; }
.input.auto { width: auto; }
.input.big { font-size: 18px; font-weight: 700; }
.input.body { font-size: 16px; line-height: 1.85; min-height: 300px; resize: none; overflow: hidden; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count.over { color: var(--bad); font-weight: 700; }
.form-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 16px; }

.write { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
.stream { margin: 0; max-height: 220px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 13px/1.6 var(--font-body); }
.alts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 3px 12px; font: inherit; font-size: 13.5px; text-align: left; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; }

.issues { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 6px; }
.issue { display: grid; grid-template-columns: 3.6em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 10px; border-left: 4px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 14px; }
.issue.must { border-left-color: var(--bad); }
.issue.should { border-left-color: var(--warn); }
.issue-cat { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.issue.must .issue-cat { color: var(--bad); }
.issue.should .issue-cat { color: var(--warn); }
.okline { margin-top: 14px; color: var(--good); font-weight: 600; }
.manual-checks { margin: 0; border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px 12px; display: grid; gap: 6px; }
.manual-checks legend { padding: 0 6px; font-weight: 600; font-size: 14px; }
.ck { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; font-size: 14.5px; }
.ck input { margin-top: 5px; accent-color: var(--accent); }

.card-list { display: grid; gap: 16px; }
.card-ed { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; align-items: start; padding-top: 16px; border-top: 1px solid var(--line); }
.card-ed.wide { grid-template-columns: minmax(0, 1fr); }
.card-ed.wide .cv-wrap { max-width: 520px; }
.cv { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; }
.cv.masking { cursor: crosshair; touch-action: none; outline: 2px solid var(--accent); outline-offset: 2px; }
.card-ed.masking { grid-template-columns: minmax(0, 1fr); }
.card-ed.masking .cv-wrap { max-width: 520px; }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ph-ctl { display: grid; gap: 10px; padding: 12px; border: 1px dashed var(--line); border-radius: 10px; }
.range { width: 100%; max-width: 360px; accent-color: var(--accent); }
label.btn { cursor: pointer; }
label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.big-img { display: block; max-width: 100%; height: auto; margin: 0 auto; border-radius: 8px; }

.drafts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.draft { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.link-title { border: 0; background: none; padding: 0; color: var(--ink); font: inherit; font-size: 17px; font-weight: 700; text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
.link-title:hover { color: var(--accent); }

.dlg { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--panel); color: var(--ink); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 40px); overflow: auto; }
.dlg.wide { width: min(880px, calc(100vw - 32px)); }
.dlg::backdrop { background: rgba(10, 16, 30, .55); }
.dlg-h { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
.dlg-h h2 { font-size: 18px; }
.dlg-b { padding: 16px 18px 20px; }
.scroll-x { overflow-x: auto; }
.tbl { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tbl th { color: var(--muted); font-weight: 600; white-space: nowrap; }
.tbl tr.past td { color: var(--muted); }
.ul { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; max-width: 80ch; }
.ul.src li > .btn { margin-left: 6px; }
.node-row { display: grid; grid-template-columns: 118px 128px minmax(160px, 1.2fr) minmax(180px, 1.6fr) 118px auto; gap: 6px; align-items: center; min-width: 860px; }

#toast { position: fixed; left: 50%; bottom: 24px; z-index: 60; max-width: min(520px, calc(100vw - 32px)); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 14px; opacity: 0; pointer-events: none; transform: translate(-50%, 16px); transition: opacity .18s, transform .18s; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 900px) {
  .write { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .page { padding: 16px 16px 90px; }
  .panel { padding: 14px 14px; }
  .card-ed { grid-template-columns: minmax(0, 1fr); }
  .cv-wrap { max-width: 240px; }
  .issue { grid-template-columns: minmax(0, 1fr) auto; }
  .issue-cat { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) {
  #toast { transition: none; }
}

/* 可报名区、赛道、AI 味 */
.grid.reg { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.regc { display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.regc.open { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.regc h3 { margin: 0; font-size: 20px; }
.regc p { margin: 0; }
.regc .row { margin-top: auto; padding-top: 6px; }
.reg-when { font-weight: 800; font-size: 17px; }
.tracks { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill.track { background: transparent; border: 1px solid var(--line); font-weight: 600; }
.sub-h { margin: 18px 0 8px; font-size: 16px; }
.comp.stub { opacity: .86; }
.ai-meter { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.ai-meter .ai-bar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.ai-meter .ai-bar span { display: block; height: 100%; background: #178a55; }
.ai-meter.mid .ai-bar span { background: #d98a1c; }
.ai-meter.bad { border-color: #d9412b; }
.ai-meter.bad .ai-bar span { background: #d9412b; }

.poster-box { display: grid; gap: 10px; margin-bottom: 14px; }
.poster-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.poster-row .cv.poster { width: 260px; flex: 0 0 auto; }
.poster-row.wide .cv.poster { width: 360px; }

/* 模板与 AI 助手 */
.tpl-box { display: grid; gap: 6px; padding: 12px; border-radius: 10px; background: var(--bg); }
.tpl-box p { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chat-log { max-height: 340px; overflow-y: auto; display: grid; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
.msg { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: start; }
.msg .who { font-size: 12px; font-weight: 800; padding: 3px 0; text-align: center; border-radius: 6px; background: var(--line); }
.msg.ai .who { background: var(--accent); color: #fff; }
.msg p { margin: 0; white-space: pre-wrap; line-height: 1.7; }
.chat-in { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
.gzh-preview { max-height: 60vh; overflow-y: auto; padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: #2B3446; }

</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1><span>竞赛攻略</span>工作台</h1>
      <p><span id="lib-meta">内置竞赛库</span> · <span id="cloud" class="cloud">正在连接</span></p>
    </div>
    <nav class="nav" aria-label="主导航">
      <a href="#library">竞赛库</a>
      <a href="#write">写攻略</a>
      <a href="#drafts">我的攻略</a>
      <a href="#profile">机构档案</a>
    </nav>
  </div>
</header>
<main class="page" id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
"use strict";
/* ===== 内置竞赛库与默认设置 ===== */
const LIB_REV = "2026-11-18";

/* 节点状态：已公布 / 单一来源 / 按上届推测 / 未公布
   d、e 写 YYYY-MM-DD；只知道月份写 YYYY-MM；不知道留空 */
const BUILTIN = [
  {
    id: "cumcm", name: "全国大学生数学建模竞赛", short: "国赛数模", cat: "建模类", listNo: 5,
    org: "中国工业与应用数学学会（全国大学生数学建模竞赛组委会）",
    cycle: "每年一届，9 月开赛",
    format: "周四 18 时开赛，周日 20 时交卷，全队合写一篇建模论文。2026 年共 5 道题，本科组 3 道、高职高专组 2 道。",
    team: "每队 1 到 3 名大学生。可以有指导教师，但竞赛期间指导教师不能参与",
    fee: "各赛区自己定。例：2026 年山西赛区 200 元/队",
    site: "https://www.mcm.edu.cn",
    nodes: [
      { d: "2026-09-07", e: "", when: "2026 年 9 月 7 日 20 时", text: "向全国组委会报名截止，各赛区和学校的校内截止更早", st: "已公布" },
      { d: "2026-09-10", e: "2026-09-13", when: "2026 年 9 月 10 日（周四）18 时至 9 月 13 日（周日）20 时", text: "2026 年竞赛", st: "已公布" },
      { d: "2027-09", e: "", when: "2027 年 9 月上旬", text: "2027 年竞赛。通知还没出，上一届是 9 月 10 日周四 18 时开赛", st: "按上届推测" }
    ],
    rules: [
      "竞赛期间不能和队外任何人讨论赛题，指导教师也算队外。被动收到别人的讨论内容，同样按严重违纪处理。",

function timelineCard(comp) {

  if (!dl) { toast("这里不能直接存文件。点每张图的“存这一张”，在弹出的大图上长按或右键保存。", 6000); return; }
  if (btn) { btn.disabled = true; btn.textContent = "正在打包"; }
  try {
    const files = [];
    for (let i = 0; i < g.cards.length; i++) {
      const b = await cardBlob(g, i);
      if (b) files.push({ name: pad2(i + 1) + "-" + cardLabel(g.cards[i]) + ".png", data: new Uint8Array(await b.arrayBuffer()) });
    }
    files.push({ name: "正文.txt", data: new TextEncoder().encode(exportText(g)) });
    const zip = makeZip(files);
    await dl.save({ filename: fileBase(g) + "-图文包.zip", data: new Blob([zip], { type: "application/zip" }) });
    toast("图文包已保存");
  } catch (e) {
    toast(dlGone(e) ? "这里不能直接存文件。点每张图的“存这一张”，在弹出的大图上长按或右键保存。" : dlErr(e), 6000);
  }
  finally { if (btn) { btn.disabled = false; btn.textContent = "全部存成 zip"; } }
}

/* ---------- 我的攻略 ---------- */
function viewDrafts() {
  const list = Array.from(S.guides.values()).sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
  const today = midnight(new Date());
  const root = h("div", { class: "stack" });
  root.append(h("div", { class: "panel-h" },
    h("div", null, h("h2", { text: "我的攻略" }), h("p", { class: "muted sm", text: list.length ? "共 " + list.length + " 篇，最近改的排在前面。" : "" })),
    h("a", { class: "btn primary", href: "#write", text: "写一篇新的" })));
  if (!list.length) {
    root.append(h("section", { class: "panel stack" },
      h("p", { text: S.cloud === "loading" || S.cloud === "wait" ? "正在读取已保存的攻略。" : "还没有保存过攻略。生成或写完一篇，会自动出现在这里。" }),
      h("div", null, h("button", { class: "btn", type: "button", onclick: function () { openGuide(exampleGuide(), false); } }, "先看一篇示例草稿"))));
    return root;
  }
  root.append(h("ul", { class: "drafts" }, list.map(function (g) {
    const c = issueCounts(runChecks(g, compById(g.compId), S.settings, today));
    return h("li", { class: "draft" },
      h("div", { class: "stack sm" },
        h("button", { class: "link-title", type: "button", onclick: function () { openGuide(normGuide(clone(g), g.id), false); } }, g.title || "（还没有标题）"),
        h("div", { class: "pills" },
          h("span", { class: "pill st-" + STATUSES.indexOf(g.status), text: g.status }),
          h("span", { class: "pill", text: PLATFORMS[g.platform].name }),
          g.compName ? h("span", { class: "pill", text: g.compName }) : null,
          c.must ? h("span", { class: "pill lv-must", text: "必改 " + c.must }) : h("span", { class: "pill lv-ok", text: "必改 0" }),
          g._local ? h("span", { class: "pill st-one", text: "只存在这台设备" }) : null),
        h("span", { class: "muted sm", text: "最后修改 " + mdhm(g.updatedAt) + " · 正文 " + clen(g.body.trim()) + " 字 · 配图 " + g.cards.length + " 张" })),
      h("div", { class: "row" },
        h("button", { class: "btn ghost sm", type: "button", onclick: async function () {
          const n = normGuide(clone(g), uid("g")); n.title = g.title ? g.title + "（副本）" : ""; n.status = "草稿"; n.createdAt = n.updatedAt = Date.now();
          S.guides.set(n.id, n);
          await Store.put("guides", n.id, n).catch(function () { Store.putLocal("guides", n.id, n); });
          render(); toast("已复制一份");
        } }, "复制一份"),
        h("button", { class: "btn ghost sm", type: "button", onclick: async function () {
          if (!(await confirmBox("删除“" + (g.title || "未命名") + "”？删了不能恢复。", "删除", true))) return;
          S.guides.delete(g.id);
          if (S.cur && S.cur.id === g.id) { S.cur = null; S.dirty = false; }
          await Store.del("guides", g.id).catch(function () { toast("共享数据里没删掉，稍后再试"); });
          render();
        } }, "删除")));
  })));
  return root;
}

/* ---------- 学长档案 ---------- */
function viewProfile() {
  const st = S.settings;
  S.profileDirty = false;
  const dirty = function () { S.profileDirty = true; };
  const f = {
    nick: h("input", { class: "input", id: "pf-nick", type: "text", value: st.nick, oninput: dirty }),
    identity: h("input", { class: "input", id: "pf-id", type: "text", placeholder: "例：一家做大学生竞赛辅导的机构，导师是 985 高校毕业的学长学姐", value: st.identity, oninput: dirty }),
    slogan: h("input", { class: "input", id: "pf-slogan", type: "text", placeholder: "例：学长学姐陪你打竞赛", value: st.slogan || "", oninput: dirty }),
    mentors: h("textarea", { class: "input", id: "pf-mentors", rows: "5", placeholder: "每行一位，写成：称呼｜背景｜竞赛经历\n例：周学长｜985 硕士毕业，自动化专业｜电赛全国一等奖，带过 6 支校队", value: st.mentors || "", oninput: dirty }),
    call: h("input", { class: "input", id: "pf-call", type: "text", value: st.call, oninput: dirty }),
    habits: h("textarea", { class: "input", id: "pf-habits", rows: "2", value: st.habits, oninput: dirty }),
    exp: h("textarea", { class: "input", id: "pf-exp", rows: "5", placeholder: "例：2024 年全国大学生数学建模竞赛，本科组某某奖，队里负责写作\n例：带过 3 支校内队伍，其中 1 支进了省赛", value: st.exp, oninput: dirty }),
    style: h("textarea", { class: "input", id: "pf-style", rows: "10", value: st.style.join("\n"), oninput: dirty }),
    banAi: h("textarea", { class: "input", id: "pf-ai", rows: "5", value: st.banAi.join(" "), oninput: dirty }),
    banPromise: h("textarea", { class: "input", id: "pf-pr", rows: "3", value: st.banPromise.join(" "), oninput: dirty }),
    banLead: h("textarea", { class: "input", id: "pf-lead", rows: "3", value: st.banLead.join(" "), oninput: dirty }),
    emojiMax: h("input", { class: "input auto", id: "pf-emoji", type: "number", min: "0", max: "20", value: String(st.emojiMax), oninput: dirty }),
    theme: h("select", { class: "input auto", id: "pf-theme", value: st.theme, onchange: dirty }, Object.keys(THEMES).map(function (k) { return h("option", { value: k, text: THEMES[k].name }); }))
  };
  const save = async function () {
    const n = normSettings({
      nick: f.nick.value.trim() || DEFAULT_SETTINGS.nick, identity: f.identity.value.trim(), slogan: f.slogan.value.trim(), mentors: f.mentors.value.trim(), banEmpty: st.banEmpty, call: f.call.value.trim() || "学弟学妹", habits: f.habits.value.trim(), exp: f.exp.value.trim(),
      style: linesOf(f.style.value), banAi: wordsOf(f.banAi.value), banPromise: wordsOf(f.banPromise.value), banLead: wordsOf(f.banLead.value),
      emojiMax: parseInt(f.emojiMax.value, 10), theme: f.theme.value
    });
    if (isNaN(n.emojiMax)) n.emojiMax = 3;
    S.settings = n; S.profileDirty = false;
    try { await Store.put("settings", "profile", n); toast("已保存"); }
    catch (e) { Store.putLocal("settings", "profile", n); toast("共享数据没存上，已先存在这台设备"); }
  };
  return h("div", { class: "stack" },
    h("div", { class: "panel-h" },
      h("div", null, h("h2", { text: "机构档案" }), h("p", { class: "muted sm", text: "每次生成都会带上这里的内容。账号名会出现在每一张配图上。" })),
      h("button", { class: "btn primary", type: "button", onclick: save }, "保存")),
    h("section", { class: "panel stack" },
      h("h3", { text: "账号和机构" }),
      h("div", { class: "form-2" },
        field("账号名", f.nick, "会出现在每一张配图上"),
        field("一句话口号", f.slogan, "出现在公众号配图的页脚和头图上，可以不填"),
        field("机构介绍", f.identity, "只写真的。不填，正文里就不会出现学校、人数、成绩"),
        field("对读者的称呼", f.call),
        field("说话习惯", f.habits)),
      field("导师团", f.mentors, "只写真实的人和真实的经历。填了之后，写攻略时可以选某一位出镜，用“我”来讲")),
    h("section", { class: "panel stack" },
      h("h3", { text: "机构的真实成绩" }),
      h("p", { class: "banner", text: "这一栏只写拿得出证书、公示名单或作品的事，页面不会替你编。编出来的获奖经历用在招生内容里属于虚假宣传，小红书也把虚假人设、伪造经历列为违规。自己的奖项盖不住三类比赛时，更稳的做法是请真实拿过奖的队友或学员，各讲各的赛道。" }),
      field("每行写一条", f.exp, "写了，生成时会用上；没写的经历，草稿里留【补】等你填")),
    h("section", { class: "panel stack" },
      h("h3", { text: "语感规范" }),
      field("写法要求，每行一条", f.style, "生成和改写都按这些来。发现哪种句式老出现，就加一条禁掉它"),
      h("div", { class: "form-2" },
        field("表情符号上限", f.emojiMax),
        field("配图默认风格", f.theme))),
    h("section", { class: "panel stack" },
      h("h3", { text: "禁用词" }),
      field("套话和机器腔", f.banAi, "用空格分开。出现了会标成“建议改”"),
      field("承诺和极限用语", f.banPromise, "出现了会标成“必改”"),
      field("站外导流词（只查小红书）", f.banLead, "出现了会标成“必改”")),
    h("div", { class: "row end wrap" },
      h("button", { class: "btn ghost", type: "button", onclick: async function () {
        if (!(await confirmBox("把语感规范和三组禁用词恢复成默认？昵称、身份和经历不动。", "恢复默认", true))) return;
        const d = clone(DEFAULT_SETTINGS);
        f.style.value = d.style.join("\n"); f.banAi.value = d.banAi.join(" "); f.banPromise.value = d.banPromise.join(" "); f.banLead.value = d.banLead.join(" ");
        f.emojiMax.value = String(d.emojiMax);
        dirty(); toast("已填回默认值，点保存才生效");
      } }, "恢复默认规范"),
      h("button", { class: "btn primary", type: "button", onclick: save }, "保存")));

/* ---------- 路由与启动 ---------- */
const ROUTES = ["library", "write", "drafts", "profile"];
function readRoute() { const r = (location.hash || "").replace(/^#/, ""); return ROUTES.indexOf(r) >= 0 ? r : "library"; }
function go(r) { if (readRoute() === r) { S.route = r; render(); } else location.hash = "#" + r; }
function render() {
  const view = $("#view"); if (!view) return;
  const act = document.activeElement && document.activeElement.id;
  const pos = act && document.activeElement.selectionStart != null ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
  Array.prototype.forEach.call(document.querySelectorAll(".nav a"), function (a) {
    if (a.getAttribute("href") === "#" + S.route) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  const v = S.route === "write" ? viewWrite() : S.route === "drafts" ? viewDrafts() : S.route === "profile" ? viewProfile() : viewLibrary();
  setKids(view, v);
  if (S.route === "write") fillEditor();
  if (act) {
    const el = document.getElementById(act);
    if (el && view.contains(el)) { el.focus(); if (pos) { try { el.setSelectionRange(pos[0], pos[1]); } catch (e) { /* 忽略 */ } } }
  }
}
function boot() {
  Store.loadLocal(); applyLocal();
  S.route = readRoute();
  const meta = $("#lib-meta");
  if (meta) meta.textContent = (S.settings.nick || "启航智学") + " · 84 项竞赛目录 · " + (S.daily && S.daily.lastRun ? "自动更新于 " + S.daily.lastRun : "资料核对到 " + LIB_REV);
  render(); cloudNote();
  window.addEventListener("hashchange", function () { S.route = readRoute(); render(); window.scrollTo(0, 0); });
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", debounce(function () { if (S.route === "write" && S.cur) drawPreviews(); }, 400));
  useCap("user").then(function (u) {
    if (!u || typeof u.can !== "function") return;
    Promise.resolve(u.can("data.write")).then(function (v) {
      if (v === false) { S.canWrite = false; cloudNote(); } else if (v === true) S.canWrite = true;
    }, function () { });
  });
  useCap("db").then(function (db) {
    if (db) { try { startCloud(db); } catch (e) { S.cloud = "local"; Store.cloud = false; cloudNote(); } }
    else { S.cloud = "local"; cloudNote(); loadPublicData(); }
  });
}
/* 不在 claude.ai 里打开时（比如部署在 Netlify 上），从网站每天更新的 data.json 读竞赛库 */
async function loadPublicData() {
  let d = null;
  for (const u of ["../data.json", "data.json"]) {
    try { const r = await fetch(u + "?t=" + Date.now(), { cache: "no-store" }); if (r.ok) { d = await r.json(); break; } } catch (e) { /* 试下一个 */ }
  }
  if (!d || typeof d !== "object" || !d.comps) return;
  const mine = Store.local.competitions || {};
  Object.keys(d.comps).forEach(function (id) {
    if (mine[id]) return;
    const v = d.comps[id]; if (v && typeof v === "object") S.overrides.set(id, Object.assign({ by: "daily" }, v));
  });
  Object.keys(d.research || {}).forEach(function (id) { if (!S.research.has(id)) S.research.set(id, normResearch(d.research[id])); });
  S.daily = { lastRun: d.updated || "" };
  S.ovRev++;
  const meta = $("#lib-meta");
  if (meta) meta.textContent = (S.settings.nick || "启航智学") + " · 84 项竞赛目录 · 自动更新于 " + (d.updated || "—");
  if (S.route === "library") render();
}
boot();

})();
